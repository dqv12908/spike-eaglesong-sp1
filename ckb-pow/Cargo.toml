[package]
name = "ckb-pow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "no_std CKB header + Eaglesong PoW verification (zkVM spike)"

[features]
default = []
# Host-only: parse CKB JSON-RPC headers into molecule bytes.
rpc = ["dep:serde_json", "dep:hex"]

[dependencies]
blake2b-ref = { version = "0.3", default-features = false }
ruint = { version = "1", default-features = false }
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
