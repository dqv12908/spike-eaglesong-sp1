[package]
name = "custody-lock"
version = "0.1.0"
edition = "2021"

[dependencies]
ckb-std = { version = "1.1", default-features = false, features = ["allocator", "dummy-atomic"] }
blake2b-ref = "0.3"
ed25519-compact = { version = "2.1", default-features = false, features = ["opt_size"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[workspace]
